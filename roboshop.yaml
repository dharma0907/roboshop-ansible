- name: roboshop instances management 
  hosts: local
  connection: local
  gather_facts: no
  vars:
    instances: [ "mongo", "redis", "mysql", "rabbitmq" ]
    image_id: ami-0220d79f3f480ecf5

  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      # security groups, we have multiple to add
      security_groups: 
      - "roboshop-common"
      - "roboshop-{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output
  
  # - name: print the output
  #   debug:
  #     msg: "{{ ec2_output }}"

  - name: create route 53 record
    debug:
      msg: "Instance name: {{  item.item }} and Private IP: {{ item.instances[0].private_ip_address }}"
    loop: "{{ ec2_output.results }}"
     
    
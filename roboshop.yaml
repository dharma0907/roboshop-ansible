- name: roboshop instances management 
  hosts: local
  connection: local
  gather_facts: no
  vars:
    instances: [ "mongo", "redis", "mysql", "rabbitmq" , "frontend" ]
    image_id: ami-0220d79f3f480ecf5
    domain_name: dcinema.online
    action: 
    - create
    - delete

  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      # security groups, we have multiple to add
      security_groups: 
      - "roboshop-common"
      - "roboshop-{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == 'create'
  
  # - name: print the output
  #   debug:
  #     msg: "{{ ec2_output }}"

  # - name: create route 53 record
  #   debug:
  #     msg: "Instance name: {{  item.item }} and Private IP: {{ item.instances[0].private_ip_address }}"
  #   loop: "{{ ec2_output.results }}"
  # here we are creating A record for all the instance using loop and private ip address
  - name: create route 53 record for all instances
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" #mongo.dcimea.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: item.item != "frontend"
  
  - name: create route 53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" #dcimea.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"


  # delete the route53 records
  - name: delete route 53 records
    amazon.aws.route53:
     state: absent
     record: "{{ item.instances[0].private_ip_address }}" # to delete all private ips
     ttl: 1
     type: A
     zone: "{{ domain_name }}"
    loop: "{{ ec2_ouput.results }}" 
    when: action == "delete"

  # delete the route53 records for frontend
  - name: delete route 53 records
    amazon.aws.route53:
     state: absent
     record: "{{ domain_name }}" # to delete frontend which is publicip
     ttl: 1
     type: A
     zone: "{{ domain_name }}"
    loop: "{{ ec2_ouput.results }}" 
    when: 
    - action == "delete"
    - item == "frontend"

